[package]
name = "myelin-chess"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A playable, replayable game using real Myelin sessions"

[dependencies]
myelin-session = { git = "https://github.com/Myelin-Labs/Myelin", rev = "5c38d13348e1d2673ae52c742dabce0aa0308195" }
myelin-consensus = { git = "https://github.com/Myelin-Labs/Myelin", rev = "5c38d13348e1d2673ae52c742dabce0aa0308195" }
myelin-session-store-rocksdb = { git = "https://github.com/Myelin-Labs/Myelin", rev = "5c38d13348e1d2673ae52c742dabce0aa0308195" }
blake3 = "1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
tiny_http = "0.12"
tempfile = "3"

chess = "=3.2.0"
